<svg width="200" height="50" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkBold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 심볼 with glow -->
  <path d="M 12.5 10 L 22.5 20 L 12.5 30 L 2.5 20 Z" fill="url(#darkBold)" filter="url(#glow)"/>
  <path d="M 12.5 13 L 19.5 20 L 12.5 27 L 5.5 20 Z" fill="white" opacity="0.15"/>
  <circle cx="12.5" cy="17" r="1.5" fill="#FBBF24" filter="url(#glow)"/>

  <!-- 텍스트 -->
  <text x="35" y="33" 
        font-family="'Inter', 'Arial Black', sans-serif" 
        font-size="28" 
        font-weight="900" 
        fill="white"
        letter-spacing="-0.5">
    Dr.Briany
  </text>
</svg>
